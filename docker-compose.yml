# Full stack in Docker. Postgres (Supabase), Redis (Upstash) and Cloudinary are hosted,
# so you only need credentials in .env.
#
#   cp .env.example .env     # fill in credentials
#   docker compose up --build
#
# Optional: run Redis locally instead of Upstash
#   REDIS_URL=redis://redis:6379 docker compose --profile local-redis up --build

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: instacloud-api
  env_file: .env
  restart: unless-stopped

services:
  # migrate:
  #   <<: *api
  #   restart: "no"
  #   command: ["node", "apps/api/dist/scripts/migrate.js"]

  api:
    <<: *api
    ports: ["4000:4000"]
    # depends_on:
    #   migrate: { condition: service_completed_successfully }

  worker:
    <<: *api
    command: ["node", "apps/api/dist/worker.js"]
    # depends_on:
    #   migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: ["local-redis"]
    ports: ["6379:6379"]
    restart: unless-stopped
